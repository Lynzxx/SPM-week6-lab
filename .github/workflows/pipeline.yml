name: pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  package:
    needs: [ lint, test, audit ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The only place the zip is built; later jobs download this exact file.
      - name: Build the deployable zip
        run: |
          pip install -r requirements.txt -t build/
          cp app.py duckfine.py lambda_function.py build/
          cd build && zip -qr ../quackloan.zip .
      - name: Generate an SBOM
        uses: anchore/sbom-action@v0
        with:
          path: build/
          format: spdx-json
          artifact-name: sbom.spdx.json
      # Save the zip as an artifact named quackloan-deployment-package.
      - uses: actions/upload-artifact@v7
        with:
          name: quackloan-deployment-package
          path: quackloan.zip

  smoke:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Download the zip built by the package job.
      - uses: actions/download-artifact@v8
        with:
          name: quackloan-deployment-package
      # The key line is `cd staged`: Flask starts inside the unzipped folder,
      # so --app app loads the app.py from the zip, and Flask and apig-wsgi
      # are also loaded from inside the zip, not from the source checkout.
      - name: Run the artifact (not the source) and smoke-test it
        run: |
          unzip -q quackloan.zip -d staged
          cd staged
          python -m flask --app app run > ../app.log 2>&1 &
          cd ..
          bash smoke.sh http://localhost:5000 || { cat app.log; exit 1; }

  # Browser test against the package, like smoke. Only the test code and
  # Playwright come from outside the zip; the app and Flask come from staged/.
  e2e:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: quackloan-deployment-package
      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run the artifact (not the source) and browser-test it
        run: |
          unzip -q quackloan.zip -d staged
          cd staged
          python -m flask --app app run > ../app.log 2>&1 &
          cd ..
          for i in $(seq 1 20); do
            curl -fs http://localhost:5000/health > /dev/null && break
            [ "$i" = 20 ] && { echo "App did not start"; cat app.log; exit 1; }
            sleep 1
          done
          E2E_BASE_URL=http://localhost:5000 python -m unittest discover -s e2e -v \
            || { cat app.log; exit 1; }

  # Real deploys happen only after a merge to main (push), never from a PR.
  staging:
    needs: [ smoke, e2e ]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: staging
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: quackloan-deployment-package
      - name: Deploy the same zip
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.FUNCTION_NAME }}" \
            --zip-file fileb://quackloan.zip \
            --query CodeSha256 --output text
          aws lambda wait function-updated \
            --function-name "${{ vars.FUNCTION_NAME }}"
      - name: Smoke-test what was deployed
        run: bash smoke.sh "${{ vars.FUNCTION_URL }}"

  # Waits for the production environment's required reviewer to approve.
  production:
    needs: staging
    runs-on: ubuntu-24.04
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: quackloan-deployment-package
      - name: Deploy the same zip
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.FUNCTION_NAME }}" \
            --zip-file fileb://quackloan.zip \
            --query CodeSha256 --output text
          aws lambda wait function-updated \
            --function-name "${{ vars.FUNCTION_NAME }}"
      - name: Smoke-test what was deployed
        run: bash smoke.sh "${{ vars.FUNCTION_URL }}"
