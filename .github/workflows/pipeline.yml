name: pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  package:
    needs: [ lint, test, audit ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The only place the zip is built; later jobs download this exact file.
      - name: Build the deployable zip
        run: |
          pip install -r requirements.txt -t build/
          cp app.py duckfine.py lambda_function.py build/
          cd build && zip -qr ../quackloan.zip .
      - name: Generate an SBOM
        uses: anchore/sbom-action@v0
        with:
          path: build/
          format: spdx-json
          artifact-name: sbom.spdx.json
      # Save the zip as an artifact named quackloan-deployment-package.
      - uses: actions/upload-artifact@v4
        with:
          name: quackloan-deployment-package
          path: quackloan.zip

  smoke:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Download the zip built by the package job.
      - uses: actions/download-artifact@v4
        with:
          name: quackloan-deployment-package
      # The key line is `cd staged`: Flask starts inside the unzipped folder,
      # so --app app loads the app.py from the zip, and Flask and apig-wsgi
      # are also loaded from inside the zip, not from the source checkout.
      - name: Run the artifact (not the source) and smoke-test it
        run: |
          unzip -q quackloan.zip -d staged
          cd staged
          python -m flask --app app run > ../app.log 2>&1 &
          cd ..
          bash smoke.sh http://localhost:5000 || { cat app.log; exit 1; }

  # Browser test against the package, like smoke. Only the test code and
  # Playwright come from outside the zip; the app and Flask come from staged/.
  e2e:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: quackloan-deployment-package
      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run the artifact (not the source) and browser-test it
        run: |
          unzip -q quackloan.zip -d staged
          cd staged
          python -m flask --app app run > ../app.log 2>&1 &
          cd ..
          for i in $(seq 1 20); do
            curl -fs http://localhost:5000/health > /dev/null && break
            [ "$i" = 20 ] && { echo "App did not start"; cat app.log; exit 1; }
            sleep 1
          done
          E2E_BASE_URL=http://localhost:5000 python -m unittest discover -s e2e -v \
            || { cat app.log; exit 1; }

  # Runs for pull requests too, so a change can be tried in staging before merging.
  staging:
    needs: [ smoke, e2e ]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "Deploy to staging goes here (Part 4)"

  # Runs for pull requests too; the production environment's required
  # reviewer must approve it before it deploys.
  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Deploy to production goes here (Part 4)"
